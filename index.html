<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PrestaTech: registro digital de préstamos de equipos de TI a colaboradores - Juan David Paz Trochez"
    />
    <title>PrestaTech | Préstamo de equipos</title>
    <script>
      // Aplica el tema guardado ANTES de que cargue React, para que la
      // página no aparezca un instante en tema claro si el usuario eligió el oscuro.
      try {
        var tema = JSON.parse(localStorage.getItem('prestatech:tema'))
        if (tema === 'claro' || tema === 'oscuro') document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
