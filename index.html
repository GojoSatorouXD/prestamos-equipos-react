<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PrestaTech: registro digital de préstamos de equipos de TI a colaboradores - Juan David Paz Trochez"
    />
    <meta name="theme-color" content="#0b0f19" />
    <title>PrestaTech | Préstamo de equipos</title>
    <!-- Tipografías: Inter (texto) y Space Grotesk (títulos), de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado ANTES de que cargue React, para que la
      // página no aparezca un instante en tema oscuro si el usuario eligió el claro.
      try {
        var tema = JSON.parse(localStorage.getItem('prestatech:tema'))
        if (tema === 'claro' || tema === 'oscuro') document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
